name: tandem

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tandem
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: tandem_local_only
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tandem -d tandem"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - tandem_postgres_data:/var/lib/postgresql/data

volumes:
  tandem_postgres_data:
